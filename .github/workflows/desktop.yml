# Сборка десктоп-приложения GameCrate (apps/desktop, Tauri 2) на трёх ОС.
#
# Живёт на публичном зеркале GitHub (GitLab → push mirror). Запускается тегом `desktop-vX.Y.Z`;
# серверные теги `vX.Y.Z` под маску не подходят. GitLab CI этот файл не видит.
# Релиз GitHub не создаём: tauri-action без tagName/releaseName только собирает, установщики
# уходят артефактами Actions (скачать со страницы запуска). Тег `desktop-vX.Y.Z` (без `-`, т.е. не
# rc/beta) после сборки выкладывает на сайт джоб `publish`: файлы и `latest.json` — через
# `PUT /download/desktop/*` API главного сервера с токеном `DESKTOP_UPLOAD_TOKEN`.
#
# Секреты (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD — подпись обновлений (minisign);
#     без них сборка падает: `createUpdaterArtifacts` в tauri.conf.json требует ключ;
#   DESKTOP_UPLOAD_TOKEN — тот же, что в `.env` главного сервера (нужен только `publish`).
# Переменная GAMECRATE_URL (Variables) — адрес сайта для сборки по тегу и для выкладки; не задана —
# прод https://gamecrate.srv5.wbrofrong.ru.
name: desktop

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      gamecrate_url:
        description: 'Адрес сайта, зашиваемый в сборку (GAMECRATE_URL). Пусто — переменная GAMECRATE_URL репозитория, без неё прод https://gamecrate.srv5.wbrofrong.ru'
        required: false
        default: ''
        type: string

# Один запуск на ref: повторный тег или запуск вручную отменяет предыдущий.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
            # universal = arm64 + x86_64 в одном .app
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle_dir: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
            artifact_paths: |
              apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: windows
            os: windows-latest
            args: --bundles nsis
            rust_targets: ''
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          - name: linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
            rust_targets: ''
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Системные пакеты (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Версия Bun — как в `packageManager` корневого package.json и в образе GitLab CI.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Нужен только @tauri-apps/cli, поэтому ставим зависимости одного пакета, а не всего монорепо.
      - name: Зависимости (Bun)
        run: bun install --frozen-lockfile --filter @cg/desktop

      # Rust stable уже стоит на раннерах; докладываем только цели для universal-сборки macOS.
      - name: Rust stable
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.rust_targets }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          if [ -n "$RUST_TARGETS" ]; then
            IFS=, read -ra targets <<< "$RUST_TARGETS"
            rustup target add "${targets[@]}"
          fi
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      # Свой адрес сайта: поле ручного запуска, иначе переменная репозитория GAMECRATE_URL (тот же
      # адрес берёт `publish` — приложение спрашивает обновления там, куда их выложили). Пустое
      # значение нельзя оставлять в окружении: `option_env!` увидит `Some("")` вместо прода.
      - name: Адрес сайта (GAMECRATE_URL)
        if: inputs.gamecrate_url != '' || vars.GAMECRATE_URL != ''
        shell: bash
        env:
          SITE_URL: ${{ inputs.gamecrate_url || vars.GAMECRATE_URL }}
        run: echo "GAMECRATE_URL=$SITE_URL" >> "$GITHUB_ENV"

      # --- Подпись кода: нет сертификатов, сборки без подписи. ---
      # macOS: «Apple Developer ID» + нотаризация. Windows: сертификат Authenticode.
      # Когда появятся — раскомментировать, добавить секреты в GitHub (Settings → Secrets) и
      # передать их в env шага tauri-action ниже.
      #
      # - name: Сертификат Apple (импорт в связку ключей)
      #   if: runner.os == 'macOS'
      #   env:
      #     APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      #   run: |
      #     echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
      #     security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
      #     security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      #     rm certificate.p12
      #
      # В env шага tauri-action: APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      # (нотаризация) и, для Windows, certificateThumbprint в tauri.conf.json → bundle.windows.

      # Без tagName/releaseName/releaseId действие только собирает и ничего не публикует.
      - name: Сборка Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          uploadUpdaterJson: false
        # Подпись обновлений (`.sig` рядом с `.app.tar.gz`, `-setup.exe`, `.AppImage`). Без секретов
        # сборка падает на подписи — это ожидаемо: неподписанное обновление updater не примет.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Что собралось
        if: always()
        shell: bash
        env:
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
        run: find "$BUNDLE_DIR" -type f \( -name '*.dmg' -o -name '*.tar.gz*' -o -name '*.exe*' -o -name '*.AppImage*' -o -name '*.deb' \) 2>/dev/null || true

      # `.sig` — подписи файлов обновления, их читает `publish` (scripts/manifest.ts).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gamecrate-${{ matrix.name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 30

  # Выкладка на сайт: только тег `desktop-vX.Y.Z` (rc/beta с `-` в версии — только сборка).
  # Файлы версии → `PUT <сайт>/download/desktop/<X.Y.Z>/<файл>`, `latest.json` — последним:
  # пока он старый, новую версию не видят ни updater, ни страница /download. Выложенный файл
  # версии API не перезаписывает (409): оборванная выкладка оставляет в бакете часть файлов,
  # и её повтор с теми же артефактами («Re-run failed jobs») пропускает файлы с тем же sha256
  # и докладывает остальные. Пересборка («Re-run all jobs») даёт другие байты — тогда ошибка,
  # и версию нужно поднять.
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
      SITE_URL: ${{ vars.GAMECRATE_URL || 'https://gamecrate.srv5.wbrofrong.ru' }}
    steps:
      - name: Версия из тега
        id: version
        shell: bash
        run: |
          version="${TAG#desktop-v}"
          if [[ "$version" == *-* ]]; then
            echo "::notice::$TAG — предрелиз, на сайт не выкладываем"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::тег $TAG: ожидался desktop-vX.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.version.outputs.publish == 'true'
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.version.outputs.publish == 'true'
        with:
          bun-version: 1.4.4

      # Версия приложения — из Cargo.toml (в tauri.conf.json её нет; если появится — сверяем и её).
      - name: Тег совпадает с версией приложения
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # shellcheck disable=SC2016 # JS в одинарных кавычках — так и задумано
          bun -e '
            const want = process.env.VERSION;
            const cargo = Bun.TOML.parse(await Bun.file("apps/desktop/src-tauri/Cargo.toml").text());
            const conf = await Bun.file("apps/desktop/src-tauri/tauri.conf.json").json();
            const found = { "Cargo.toml": cargo.package?.version, "tauri.conf.json": conf.version ?? want };
            const bad = Object.entries(found).filter(([, v]) => v !== want);
            if (bad.length > 0) {
              for (const [file, v] of bad) console.error(`::error::${file}: версия ${v}, а тег — ${want}`);
              process.exit(1);
            }
          '

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.version.outputs.publish == 'true'
        with:
          pattern: gamecrate-*
          path: artifacts

      - name: Манифест latest.json
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          base="${SITE_URL%/}/download/desktop"
          bun apps/desktop/scripts/manifest.ts --tag "$TAG" --dir artifacts \
            --out latest.json --base-url "$base" > uploads.txt
          echo "К выкладке:"; cat uploads.txt
          cat latest.json

      # Токен — в файле заголовков (`-H @файл`), не в аргументах curl: аргументы видны в списке
      # процессов, а `printf` — встроенная команда bash. В логе GitHub секрет ещё и замаскирован.
      - name: Выкладка на сайт
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DESKTOP_UPLOAD_TOKEN: ${{ secrets.DESKTOP_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DESKTOP_UPLOAD_TOKEN" ]; then
            echo "::error::нет секрета DESKTOP_UPLOAD_TOKEN (тот же, что в .env главного сервера)"
            exit 1
          fi
          headers="$RUNNER_TEMP/upload-headers"
          trap 'rm -f "$headers" "$RUNNER_TEMP/upload-reply"' EXIT
          (umask 077; printf 'Authorization: Bearer %s\n' "$DESKTOP_UPLOAD_TOKEN" > "$headers")
          unset DESKTOP_UPLOAD_TOKEN
          base="${SITE_URL%/}/download/desktop"
          reply="$RUNNER_TEMP/upload-reply"
          put() {
            local file="$1" url="$2" code published mine
            # Expect: — без 100-continue; curl повторяет только сетевые сбои и 408/429/5xx
            code=$(curl --silent --show-error --retry 3 --max-time 900 \
              -H @"$headers" -H 'Expect:' -T "$file" -o "$reply" -w '%{http_code}' "$url")
            case "$code" in
              201) echo "  выложен" ;;
              409)
                # Файл этой версии уже на сайте (повтор джоба или ответ потерялся на прошлой
                # попытке): тот же файл — пропускаем, другой — версию надо поднять.
                published=$(curl --fail --silent --show-error --retry 3 --max-time 900 "$url" \
                  | sha256sum | cut -d' ' -f1)
                mine=$(sha256sum "$file" | cut -d' ' -f1)
                if [ "$published" = "$mine" ]; then
                  echo "  уже выложен, sha256 совпадает — пропускаю"
                else
                  echo "::error::версия $VERSION уже выложена с другими файлами (${url##*/}) — поднимите версию"
                  exit 1
                fi
                ;;
              *)
                echo "::error::PUT ${url##*/}: HTTP $code"
                cat "$reply"; echo
                exit 1
                ;;
            esac
          }
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            echo "→ $VERSION/${path##*/}"
            put "artifacts/$path" "$base/$VERSION/${path##*/}"
          done < uploads.txt
          echo "→ latest.json"
          put latest.json "$base/latest.json"
          echo "::notice::GameCrate $VERSION выложен: $base/latest.json"
