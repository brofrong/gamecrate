# CI gamecrate/imt-cloud-gaming (GitLab 19.5, id 351, реестр $CI_REGISTRY_IMAGE =
# registry.imtechnologies.ru/gamecrate/imt-cloud-gaming, общий раннер linux-amd64 online;
# разрешён ли на нём privileged для docker-in-docker — не подтверждено).
#
# На каждый merge request и push в main — проверки (check). На тег vX.Y.Z (и vX.Y.Z-rc.N —
# пробный пайплайн задачи 12) — проверки и сборка/пуш образов в Container Registry проекта:
# cg-app:<тег> (+ :latest, кроме -rc тегов) и cg-session:<версия драйвера>-<тег> на каждую версию
# из images/session/drivers.txt. Коммит и тег зашиваются в cg-app как CG_COMMIT/CG_VERSION
# (deploy/Dockerfile), поэтому в админке видна версия, а не "unknown"/"dev".
#
# Сборка — через docker:27 + docker:27-dind (нужен privileged executor раннера). Если раннер
# privileged не даёт, джобы build-app и build-session переводятся на buildah
# (quay.io/buildah/stable, --storage-driver vfs, без dind). Что подходит — решает пробный
# пайплайн (задача 12), запускается только с согласия владельца.

stages:
  - check
  - build

variables:
  POSTGRES_USER: cg
  POSTGRES_PASSWORD: cg
  POSTGRES_DB: cloud_gaming
  # TLS между docker:27 (клиент) и docker:27-dind (сервис) — стандартная связка GitLab для dind.
  DOCKER_TLS_CERTDIR: "/certs"

check:
  stage: check
  image: oven/bun:1.4
  services:
    - postgres:18
  variables:
    DATABASE_URL: postgres://cg:cg@postgres:5432/cloud_gaming
    TEST_DATABASE_URL: postgres://cg:cg@postgres:5432/cloud_gaming
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  script:
    # apps/api, apps/orchestrator и packages/db читают DATABASE_URL/TEST_DATABASE_URL через
    # bun test --env-file=../../.env (см. package.json этих пакетов) — остальной конфиг тестам
    # не нужен, поэтому в .env только эти две переменные.
    - printf 'DATABASE_URL=%s\nTEST_DATABASE_URL=%s\n' "${DATABASE_URL}" "${TEST_DATABASE_URL}" > .env
    - bun install --frozen-lockfile
    - bun run check
    # `bun lint` (скрипты lint пакетов) — встроенный линтер есть только в canary-сборках Bun;
    # в релизном oven/bun:1.4 команды нет, и `bun lint` вызывает сам скрипт "lint" рекурсивно
    # (E2BIG). Линт — локальная проверка, пока линтер не попадёт в релиз Bun.
    # Пакеты api/orchestrator/db тестируются на одной базе — параллельно они ждут друг друга
    # на блокировках, поэтому пакеты гоняются по очереди. Общий раннер медленный: тест с базой
    # идёт 1,5–2,5 с и иногда не укладывается в стандартные 5 с — в CI таймаут теста 30 с.
    - bun run test --concurrency=1 -- --timeout=30000
    - bun test deploy/test

# Общее для build-app и build-session: образы собираются и пушатся только на тег релиза
# (vX.Y.Z или vX.Y.Z-rc.N для пробного пайплайна задачи 12), docker-in-docker, логин в реестр
# проекта токеном джобы (CI_REGISTRY_USER/CI_REGISTRY_PASSWORD — стандартные переменные GitLab
# для Container Registry проекта, не секрет, который нужно хранить отдельно).
.docker_build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/'
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build-app:
  extends: .docker_build
  script:
    - >
      docker build -f deploy/Dockerfile
      --build-arg CG_COMMIT=$CI_COMMIT_SHORT_SHA
      --build-arg CG_VERSION=$CI_COMMIT_TAG
      -t "$CI_REGISTRY_IMAGE/cg-app:$CI_COMMIT_TAG" .
    - docker push "$CI_REGISTRY_IMAGE/cg-app:$CI_COMMIT_TAG"
    # :latest — только для настоящих релизов, не для vX.Y.Z-rc.N пробного пайплайна (задача 12).
    - |
      case "$CI_COMMIT_TAG" in
        *-rc.*)
          echo "тег $CI_COMMIT_TAG — rc, :latest не трогаем" ;;
        *)
          docker tag "$CI_REGISTRY_IMAGE/cg-app:$CI_COMMIT_TAG" "$CI_REGISTRY_IMAGE/cg-app:latest"
          docker push "$CI_REGISTRY_IMAGE/cg-app:latest" ;;
      esac

build-session:
  extends: .docker_build
  # Несколько версий драйвера (images/session/drivers.txt) собираются по очереди в одной джобе
  # (deploy/ci/build-session-images.sh) — на раннере без privileged buildah это может быть долго,
  # отсюда щедрый таймаут (минимум 90 минут по решению задачи).
  timeout: 2h
  before_script:
    - !reference [.docker_build, before_script]
    # docker:27 — Alpine; bash для deploy/ci/build-session-images.sh, curl для скачивания .run,
    # ca-certificates — иначе curl не проверит TLS us.download.nvidia.com.
    - apk add --no-cache bash curl ca-certificates
  # Кэш .run между пайплайнами (~300 МБ на версию драйвера, скачивать на каждый тег не нужно).
  # Ключ — хэш drivers.txt: список версий поменялся — кэш новый, старых .run он не унаследует.
  cache:
    key:
      files:
        - images/session/drivers.txt
      prefix: nv
    paths:
      - images/session/nv/*.run
  script:
    - ./deploy/ci/build-session-images.sh "$CI_COMMIT_TAG"
