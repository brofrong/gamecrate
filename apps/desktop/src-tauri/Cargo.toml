[package]
name = "gamecrate-desktop"
version = "0.1.0"
description = "GameCrate — десктоп-приложение"
edition = "2021"
publish = false

[lib]
# `_lib` — чтобы имя библиотеки не совпало с бинарником (на Windows это ломает сборку).
name = "gamecrate_desktop_lib"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "=1.0.229", features = ["derive"] }
url = "=2.5.8"

[dev-dependencies]
# мок-рантайм Tauri: проверка ACL команд (какие страницы их зовут) без окна
tauri = { version = "=2.12.5", features = ["tray-icon", "test"] }
serde_json = "=1.0.154"
