# Оверлей стенда brofrong (game.brofrong.ru): главный и игровой сервер на одной машине.
#   docker compose -f compose.main.yaml -f compose.worker.yaml -f compose.stand.yaml --env-file .env …
# (так запускает deploy/deploy-stand.sh; .env — ~/cloud-gaming/.env).
#
# Агент ходит к оркестратору тем же протоколом, что удалённые серверы (WebSocket /agent с токеном
# сервера, тоннель стрима /agent/tunnel), только напрямую по внутренней сети cg, а не через
# обратный прокси: ORCHESTRATOR_URL=ws://cg-orchestrator:3001/agent. S3 профилей он получает от
# оркестратора (/agent/config), поэтому в .env стенда S3_PUBLIC_ENDPOINT=http://cg-rustfs:9000 —
# тоже по сети cg.
#
# Пути brofrong (CG_DATA_DIR=/raid/cloud-gaming, SCRATCH_DIR, STEAM_CLIENT_DIR,
# STEAM_CLIENT_PARENT) deploy-stand.sh дописывает в .env стенда, если их там нет, — их читают
# bind-ы и переменные самого compose.worker.yaml. Здесь — только то, что у стенда иначе, чем у
# игрового сервера после install.sh; значения по умолчанию повторены в deploy/deploy-stand.sh и
# deploy/build-steam-client.sh (обёртка для стенда) — менять вместе.
services:
  cg-agent:
    environment:
      ORCHESTRATOR_URL: ws://cg-orchestrator:${ORCHESTRATOR_PORT:-3001}/agent
      WORKER_ID: ${WORKER_ID:-brofrong}
      WORKER_PUBLIC_IP: ${WORKER_PUBLIC_IP:-37.153.14.138}
      GBM_ALLOCATOR_PATH: ${GBM_ALLOCATOR_PATH:-/usr/lib/x86_64-linux-gnu/nvidia/current/libnvidia-allocator.so.550.163.01}
    networks:
      cg: {}
    depends_on:
      cg-orchestrator:
        condition: service_healthy
      cg-rustfs:
        condition: service_healthy
