# Боевой деплой на brofrong. Запуск: см. deploy/deploy.sh и deploy/README.md.
# Переменные читаются из ~/cloud-gaming/.env (docker compose --env-file .env),
# который деплой не создаёт и не перезаписывает (дописывает только строки AGENT_TOKEN,
# RUSTFS_ACCESS_KEY, RUSTFS_SECRET_KEY, PROFILE_KEY, если их нет) — см. README.
name: cloud-gaming

# Ротация логов docker: без неё json-file растёт без ограничений.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Один образ приложения на api, оркестратор и агента (разные `command`). Собирается
# сервисом cg-api; cg-orchestrator и cg-agent берут тот же тег (pull_policy: never —
# образ локальный, в реестре его нет).
x-app-image: &app-image cloud-gaming/cg-api:latest

services:
  cg-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: *app-image
    container_name: cg-api
    restart: unless-stopped
    # Только нужные api переменные, а не весь .env: POSTGRES_PASSWORD сюда не попадает
    # (пароль уже внутри DATABASE_URL). Значения подставляются из --env-file .env.
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      STEAM_API_KEY: ${STEAM_API_KEY:?STEAM_API_KEY is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      POCKET_ID_URL: ${POCKET_ID_URL:?POCKET_ID_URL is required}
      POCKET_ID_CLIENT_ID: ${POCKET_ID_CLIENT_ID:?POCKET_ID_CLIENT_ID is required}
      POCKET_ID_CLIENT_SECRET: ${POCKET_ID_CLIENT_SECRET:?POCKET_ID_CLIENT_SECRET is required}
      POCKET_ID_ADMIN_GROUP: ${POCKET_ID_ADMIN_GROUP:?POCKET_ID_ADMIN_GROUP is required}
      WEB_DIST_DIR: ${WEB_DIST_DIR:-/app/apps/web/dist}
      SMTP_URL: ${SMTP_URL:?SMTP_URL is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}
    mem_limit: 512m
    logging: *logging
    networks:
      - cg
      - proxy
      # Контейнеры сессий (Selkies, http://cg-session-<id>:8080) — только для прокси /stream/<id>/.
      - cg-sessions
    depends_on:
      cg-postgres:
        condition: service_healthy
    healthcheck:
      # В образе нет curl/wget — используем встроенный fetch через `bun -e`.
      test:
        - "CMD"
        - "bun"
        - "-e"
        - "fetch('http://localhost:'+(process.env.PORT||3000)+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Порты наружу не публикуются: наружу отдаёт ingressi (Caddy) через внешнюю сеть proxy.

  # Оркестратор: планировщик и таймеры сессий, WebSocket /agent для агентов воркеров.
  # Только сеть cg, порт наружу не публикуется (агенты подключаются изнутри cg).
  cg-orchestrator:
    image: *app-image
    pull_policy: never
    container_name: cg-orchestrator
    command: ["bun", "apps/orchestrator/src/main.ts"]
    restart: unless-stopped
    environment:
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AGENT_TOKEN: ${AGENT_TOKEN:?AGENT_TOKEN is required}
      # Ключ шифрования посеянных входов Steam в БД (steam_login_seeds), base64 ровно 32 байт.
      SEED_KEY: ${SEED_KEY:?SEED_KEY is required}
    mem_limit: 256m
    logging: *logging
    networks:
      - cg
    depends_on:
      cg-postgres:
        condition: service_healthy
      # api и оркестратор оба применяют миграции при старте; api healthy = его миграции
      # уже прошли, так они не идут параллельно.
      cg-api:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "bun"
        - "-e"
        - "fetch('http://localhost:'+(process.env.ORCHESTRATOR_PORT||3001)+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Агент воркера brofrong: запускает/останавливает контейнеры сессий cg-session-<id>
  # (роль worker) и установщиков cg-install-<jobId> (роль gamestore) через Docker API.
  # Сокет Docker смонтирован; процесс — пользователь bun (1000) с дополнительной группой
  # владельца сокета (DOCKER_GID, deploy.sh берёт её из `stat -c %g /var/run/docker.sock`),
  # без privileged и без root.
  # Контейнеры сессий и установщиков не входят в compose-проект: `docker compose up/down`
  # их не трогает, перезапущенный агент подхватывает живые сессии по метке cg.session.
  #
  # Каталоги хоста (владелец uid 1000, создаёт deploy.sh) монтируются в агент по тем же
  # путям: агент передаёт их dockerd как lower/upper overlay-томов и bind помощников, а
  # сам создаёт в них upper/work и переносит готовые игры. Перенос `rename` из
  # INSTALL_SCRATCH_DIR в LIBRARY_DIR работает только в пределах одной точки
  # монтирования (между двумя bind даже одной ФС — EXDEV), поэтому библиотека и
  # scratch установок лежат в одном CG_DATA_DIR и монтируются одним bind.
  # SCRATCH_DIR (scratch сессий, NVMe) — отдельный bind. create_host_path: false —
  # без заранее созданного каталога контейнер не стартует (иначе Docker создал бы его
  # от root, и агент с uid 1000 не смог бы в нём писать).
  # STEAM_CLIENT_DIR (шаблон клиента Steam) — на NVMe, а не в CG_DATA_DIR на HDD: с
  # холодного кэша Steam читал его с RAID и стартовал 50–90 с вместо ~16. Агент передаёт
  # его dockerd как lower overlay по пути хоста (не через bind ниже), а в сам агент
  # нужен только на чтение — mtime каталога для даты сборки шаблона в блоке «Версии»
  # админки (hostProbe.ts/WorkerMonitor.ts); писать агент туда не должен.
  # В агент смонтирован не сам STEAM_CLIENT_DIR, а его родитель STEAM_CLIENT_PARENT
  # (read_only), и именно по этой причине: build-steam-client.sh заменяет каталог
  # `mv -T --exchange` — bind конкретного пути (STEAM_CLIENT_DIR) держал бы старый
  # inode после обмена (bind-mount помнит дентри на момент монтирования, а не путь),
  # и mtime навсегда остался бы от прошлой сборки. Bind родителя при каждом обращении
  # резолвит имя заново и видит актуальный каталог.
  # Значения по умолчанию CG_DATA_DIR, SCRATCH_DIR, STEAM_CLIENT_DIR и
  # STEAM_CLIENT_PARENT повторены в deploy.sh, README и build-steam-client.sh —
  # менять вместе.
  # GPU (capabilities: [utility], без него у cg-agent GPU нет) — только чтобы
  # NVIDIA Container Toolkit подложил nvidia-smi и NVML для метрик админки;
  # видеопамять и вычисления агент не занимает (это не сессия).
  cg-agent:
    image: *app-image
    pull_policy: never
    container_name: cg-agent
    command: ["bun", "apps/agent/src/main.ts"]
    restart: unless-stopped
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:-995}"
    environment:
      WORKER_ID: ${WORKER_ID:-brofrong}
      ORCHESTRATOR_URL: ws://cg-orchestrator:${ORCHESTRATOR_PORT:-3001}/agent
      AGENT_TOKEN: ${AGENT_TOKEN:?AGENT_TOKEN is required}
      WORKER_PUBLIC_IP: ${WORKER_PUBLIC_IP:-37.153.14.138}
      SLOTS: ${SLOTS:-1}
      UDP_PORT_BASE: ${UDP_PORT_BASE:-59000}
      # Коммит агента для блока «Версии» админки — ставит deploy.sh (CG_COMMIT=<значение>
      # в окружении docker compose up); без него — "unknown".
      CG_COMMIT: ${CG_COMMIT:-unknown}
      SESSION_IMAGE: ${SESSION_IMAGE:-cg-session:550.163.01}
      SESSION_NETWORK: cg-sessions
      GBM_ALLOCATOR_PATH: ${GBM_ALLOCATOR_PATH:-/usr/lib/x86_64-linux-gnu/nvidia/current/libnvidia-allocator.so.550.163.01}
      DOCKER_SOCKET: /var/run/docker.sock
      ROLES: ${ROLES:-worker,gamestore}
      LIBRARY_DIR: ${CG_DATA_DIR:-/raid/cloud-gaming}/library
      # Родитель — STEAM_CLIENT_PARENT (по умолчанию /home/brofrong/cloud-gaming-steam,
      # см. волюм ниже и комментарий выше про bind родителя, а не самого каталога).
      STEAM_CLIENT_DIR: ${STEAM_CLIENT_DIR:-/home/brofrong/cloud-gaming-steam/client}
      INSTALL_SCRATCH_DIR: ${CG_DATA_DIR:-/raid/cloud-gaming}/install-scratch
      SCRATCH_DIR: ${SCRATCH_DIR:-/home/brofrong/cloud-gaming-scratch}
      # Меньше стольких ГиБ свободно на ФС scratch — старт сессии/установки отклоняется.
      MIN_FREE_GB: ${MIN_FREE_GB:-20}
      # Хранилище профилей: те же ключи, что у cg-rustfs (корневые ключи RustFS).
      S3_ENDPOINT: http://cg-rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-cg-profiles}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      # Ключ шифрования профилей (base64 ровно 32 байт): только агенту.
      PROFILE_KEY: ${PROFILE_KEY:?PROFILE_KEY is required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${CG_DATA_DIR:-/raid/cloud-gaming}
        target: ${CG_DATA_DIR:-/raid/cloud-gaming}
        bind:
          create_host_path: false
      - type: bind
        source: ${SCRATCH_DIR:-/home/brofrong/cloud-gaming-scratch}
        target: ${SCRATCH_DIR:-/home/brofrong/cloud-gaming-scratch}
        bind:
          create_host_path: false
      - type: bind
        source: ${STEAM_CLIENT_PARENT:-/home/brofrong/cloud-gaming-steam}
        target: ${STEAM_CLIENT_PARENT:-/home/brofrong/cloud-gaming-steam}
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
    mem_limit: 1g # профиль (до 200 МиБ) сжимается и шифруется в памяти целиком (profile/codec.ts)
    logging: *logging
    networks:
      - cg
    depends_on:
      cg-orchestrator:
        condition: service_healthy
      cg-rustfs:
        condition: service_healthy
    # Healthcheck нет: у агента нет HTTP. Связь с оркестратором видна в логе
    # оркестратора («Agent connected» workerId=brofrong) и в workers.last_seen_at.

  # Хранилище профилей (S3-совместимое): зашифрованные архивы profiles/<userId>/<uuid>.cgp
  # в бакете S3_BUCKET. Только сеть cg, порты наружу не публикуются; пишет и читает только
  # cg-agent. Проверено на образе 1.0.3: S3 API на :9000, данные в /data (RUSTFS_VOLUMES),
  # ключи — RUSTFS_ACCESS_KEY/RUSTFS_SECRET_KEY, процесс — пользователь rustfs (10001).
  cg-rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: cg-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      # Пусто — лог в stdout (docker logs с ротацией x-logging), а не в файл /logs
      # в слое контейнера (по умолчанию в образе RUSTFS_OBS_LOG_DIRECTORY=/logs).
      RUSTFS_OBS_LOG_DIRECTORY: ""
    mem_limit: 512m
    logging: *logging
    volumes:
      - cg-rustfs-data:/data
    networks:
      - cg
    healthcheck:
      # В образе есть curl; /health отвечает 200, когда S3 API готов.
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "-o",
          "/dev/null",
          "http://localhost:9000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Одноразовый: создать бакет профилей, если его нет (запускает deploy.sh:
  # `docker compose run --rm cg-rustfs-bucket`, по `up` не стартует — профиль tools).
  # Пиннутый AWS CLI в сети cg; ключи — через окружение, в аргументы и вывод не попадают.
  cg-rustfs-bucket:
    image: amazon/aws-cli:2.38.4
    profiles: ["tools"]
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://cg-rustfs:9000
      BUCKET: ${S3_BUCKET:-cg-profiles}
    entrypoint:
      - bash
      - -c
      - >-
        if aws s3api head-bucket --bucket "$$BUCKET" >/dev/null 2>&1;
        then echo "bucket $$BUCKET exists";
        else aws s3api create-bucket --bucket "$$BUCKET" >/dev/null && echo "bucket $$BUCKET created";
        fi
    networks:
      - cg
    depends_on:
      cg-rustfs:
        condition: service_healthy

  cg-postgres:
    image: postgres:18
    container_name: cg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: cloud_gaming
    mem_limit: 512m
    logging: *logging
    volumes:
      - cg-postgres-data:/var/lib/postgresql
    networks:
      - cg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cg -d cloud_gaming"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Порты наружу не публикуются и сеть proxy не подключена — только внутренняя cg.

networks:
  cg:
    name: cg
  proxy:
    external: true
  # Сеть контейнеров сессий. Создаётся deploy.sh (`docker network create cg-sessions`), если её нет;
  # из сервисов compose к ней подключён только cg-api.
  cg-sessions:
    name: cg-sessions
    external: true

volumes:
  cg-postgres-data:
    name: cg-postgres-data
  cg-rustfs-data:
    name: cg-rustfs-data
